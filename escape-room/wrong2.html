<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="room denied-room">

        <div class="warning-symbol">
            ⚠
        </div>

        <h1 class="denied-title">
            ACCESS DENIED
        </h1>

        <p>
            The software cannot be released yet.
        </p>

        <p>
            A critical step was skipped.
        </p>

        <div class="interactive-door wrong-door" id="wrongDoor">

            <img
                src="images/wrong2.jpg"
                alt="Locked door"
            >

            <div class="door-message">
                <span>🔒</span>
                <strong>DOOR LOCKED</strong>
                <small>Wrong decision</small>
            </div>

        </div>

        <a class="button back-button" href="room2.html">
            TRY AGAIN
        </a>

    </div>

    <script src="script.js"></script>

</body>
</html>
