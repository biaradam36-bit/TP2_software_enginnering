<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="room denied-room">

        <div class="warning-symbol">
            ⚠
        </div>

        <h1 class="denied-title">
            ACCESS DENIED
        </h1>

        <p>
            The development process cannot begin this way.
        </p>

        <p>
            You skipped an essential step.
        </p>

        <div class="interactive-door" id="wrongDoor">

            <img
                src="images/wrong1.jpg"
                alt="Locked door"
            >

            <div class="door-message">

                <span>🔒</span>

                <strong>DOOR LOCKED</strong>

                <small>
                    Wrong decision
                </small>

            </div>

        </div>

        <div class="error-message">

            <h2>WRONG CHOICE</h2>

            <p>
                Starting programming immediately
                without defining the requirements
                can lead to serious problems.
            </p>

        </div>

        <a class="button back-button" href="room1.html">
            TRY AGAIN
        </a>

    </div>

    <script src="script.js"></script>

</body>
</html>
